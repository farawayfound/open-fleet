# Lint configuration. Ruff's default rule set (pyflakes + the pycodestyle
# errors) already came back clean on this tree; this file pins that as the
# bar the export workflow and the public CI both enforce.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data", "public-checkout"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
